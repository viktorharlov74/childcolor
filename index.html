<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2edf9">
  <title>Раскраска Анны</title>
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root {
      color-scheme: light;
      font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
      color: #302344;
      background: #f2edf9;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      --top-inset: max(12px, env(safe-area-inset-top));
      --bottom-inset: max(12px, env(safe-area-inset-bottom));
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: var(--top-inset) max(12px, env(safe-area-inset-right))
        var(--bottom-inset) max(12px, env(safe-area-inset-left));
      background: radial-gradient(ellipse at 50% 12%, #faf6ff, #f2edf9 72%);
    }

    .app {
      width: min(100%, 650px);
      margin: auto;
    }

    .art-library { position: absolute; }

    .gallery,
    .editor {
      display: grid;
      justify-items: center;
      gap: clamp(10px, 2svh, 18px);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.75rem);
      font-weight: 850;
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .gallery {
      gap: clamp(16px, 3svh, 26px);
    }

    .gallery-group {
      display: grid;
      gap: clamp(10px, 2svh, 16px);
      width: min(100%, 600px);
    }

    .gallery-group + .gallery-group {
      padding-block-start: clamp(12px, 2svh, 18px);
      border-top: 1px solid #ded2ea;
    }

    .gallery-group h2 {
      margin: 0;
      padding-inline: 4px;
      font-size: clamp(1.25rem, 4vw, 1.65rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .gallery-grid {
      --card-gap: clamp(10px, 3vw, 18px);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--card-gap);
    }

    .drawing-card {
      display: grid;
      justify-items: center;
      gap: 4px;
      min-width: 0;
      padding: 6px 8px 12px;
      border: 2px solid #fff;
      border-radius: clamp(20px, 5vw, 32px);
      background: var(--tile);
      box-shadow: 0 5px 14px #4b306316;
      font-size: clamp(1rem, 4.5vw, 1.35rem);
      font-weight: 800;
    }

    .drawing-card svg {
      display: block;
      width: 100%;
      height: clamp(82px, min(39vw, 18svh), 200px);
    }

    .drawing-card:last-child:nth-child(odd) {
      grid-column: 1 / -1;
      justify-self: center;
      width: calc((100% - var(--card-gap)) / 2);
    }

    .drawing-card.has-saved-art svg {
      --paper: none;
      border-radius: 16px;
      background: #fff;
    }

    .drawing-card:active { border-color: #b79ece; }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: min(100%, 570px, max(160px, calc(100svh - 215px)));
      min-width: min(100%, 245px);
    }

    .editor-header h1 {
      margin: 0;
      font-size: clamp(1.35rem, 5vw, 1.9rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .editor-header h1:focus { outline: none; }

    .board {
      position: relative;
      width: min(100%, 570px, max(160px, calc(100svh - 215px)));
      aspect-ratio: 1;
      overflow: hidden;
      border: 2px solid #e5daf0;
      border-radius: clamp(20px, 6vw, 34px);
      background: #fff;
      box-shadow: 0 8px 24px #4b306315;
      perspective: 800px;
    }

    .board > *,
    .artwork > * {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    canvas {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .outline { pointer-events: none; }

    .editor-controls {
      display: grid;
      justify-items: center;
      max-width: 100%;
    }

    .tools,
    .result-tools { grid-area: 1 / 1; }

    .tools {
      display: grid;
      justify-items: center;
      gap: clamp(8px, 1.5svh, 14px);
      max-width: 100%;
    }

    .editor.is-complete .tools {
      opacity: 0;
      visibility: hidden;
      transition: opacity 280ms ease, visibility 0s 280ms;
    }

    .drawing-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .sound-toggle {
      position: relative;
      width: 44px;
      min-height: 44px;
      padding: 0;
      border: 1px solid #e2d4ed;
      border-radius: 50%;
      background: #fbf8ff;
      font-size: 1.2rem;
    }

    .sound-toggle[aria-pressed="false"]::after {
      position: absolute;
      inset: 50% auto auto 25%;
      width: 50%;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      content: "";
      transform: rotate(-45deg);
    }

    .board > .replay {
      padding: 0;
      border: 0;
      background: transparent;
    }

    .celebration {
      overflow: hidden;
      pointer-events: none;
    }

    .celebration-star {
      position: absolute;
      top: -14px;
      left: var(--star-x);
      width: var(--star-size);
      aspect-ratio: 1;
      background: var(--star-color);
      clip-path: polygon(50% 0, 62% 34%, 98% 36%, 70% 58%, 80% 94%, 50% 73%, 20% 94%, 30% 58%, 2% 36%, 38% 34%);
      animation: star-fall var(--star-time) linear var(--star-delay) both;
    }

    @keyframes star-fall {
      0% { opacity: 0; transform: translate3d(0, 0, 0) rotate(-18deg); }
      14% { opacity: 0.95; }
      78% { opacity: 0.85; }
      100% { opacity: 0; transform: translate3d(var(--star-drift), var(--star-fall), 0) rotate(var(--star-turn)); }
    }

    .result-tools {
      display: grid;
      align-self: start;
      justify-items: center;
      gap: 8px;
      animation: result-tools-in 240ms ease 200ms both;
    }

    .save-result {
      min-height: 44px;
      padding: 6px 20px;
      border: 1px solid #e2d4ed;
      border-radius: 24px;
      background: #ece2f6;
      font-weight: 750;
    }

    .save-result:disabled { opacity: 0.6; }
    .save-status { margin: 0; text-align: center; }

    @keyframes result-tools-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .replay:focus-visible {
      outline-offset: -4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .editor.is-complete .tools { transition: none; }
      .result-tools { animation: none; }
      .celebration { display: none; }
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(4, auto);
      gap: clamp(3px, 1.4vw, 10px);
      max-width: 100%;
      padding: 5px clamp(4px, 2vw, 12px);
      border: 1px solid #e9dff2;
      border-radius: 40px;
      background: #fff;
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 3px solid #473369;
      outline-offset: 2px;
    }

    .swatch {
      display: grid;
      place-items: center;
      width: clamp(44px, 10vw, 54px);
      height: clamp(44px, 10vw, 54px);
      padding: 3px;
      border: 2px solid transparent;
      border-radius: 50%;
      background: transparent;
    }

    .swatch::before {
      content: "";
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--ink);
      box-shadow: inset 0 -3px 0 #30234418;
    }

    .swatch[aria-pressed="true"] { border-color: #483161; }

    .reset,
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 6px 16px;
      border: 1px solid #e2d4ed;
      border-radius: 24px;
      background: #ece2f6;
      font-weight: 750;
    }

    .back {
      padding: 6px 12px;
      background: #fbf8ff;
      white-space: nowrap;
    }

    .reset:active { background: #e1d1f1; }
    .back:active { background: #ece2f6; }
    .reset span, .back span { font-size: 1.35em; line-height: 1; }

    @media (min-width: 520px) {
      .palette { grid-template-columns: repeat(8, auto); }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .gallery-group { width: 100%; }
      .gallery-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }

      .drawing-card { font-size: clamp(0.85rem, 2.3vw, 1rem); }
      .drawing-card svg { height: min(17vw, (100svh - 192px) / 2); }

      .drawing-card:last-child:nth-child(odd) {
        grid-column: auto;
        width: 100%;
      }

      .editor {
        grid-template-columns: auto auto;
        grid-template-rows: auto auto;
        align-items: center;
        justify-content: center;
      }

      .board {
        grid-area: 1 / 1 / 3 / 2;
        width: min(54vw, calc(100svh - var(--top-inset) - var(--bottom-inset) - 8px));
      }

      .editor-header {
        grid-area: 1 / 2 / 2 / 3;
        align-self: end;
        display: grid;
        justify-items: center;
        width: auto;
        min-width: 0;
      }

      .editor-controls {
        grid-area: 2 / 2 / 3 / 3;
        align-self: start;
      }

      .palette { grid-template-columns: repeat(4, auto); }
    }

    @media (orientation: landscape) and (min-width: 720px) and (max-height: 500px) {
      .gallery-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .drawing-card svg {
        height: max(52px, min(17vw, (100svh - var(--top-inset) - var(--bottom-inset) - 194px) / 2));
      }
    }
  </style>
</head>

  <script>
    const gallery = document.querySelector(".gallery");
    const editor = document.querySelector(".editor");
    const editorTitle = document.querySelector("#editor-title");
    const outline = document.querySelector(".outline use");
    const canvas = document.querySelector("canvas");
    const context = canvas.getContext("2d");
    const catCard = gallery.querySelector('[data-drawing="cat"]');
    const catPreview = catCard.querySelector(".saved-cat-preview");
    const catStorageKey = "childcolor.completed-cat.v1";
    const artwork = document.querySelector(".artwork");
    const celebration = document.querySelector(".celebration");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const tools = document.querySelector(".tools");
    const replay = document.querySelector(".replay");
    const resultTools = document.querySelector(".result-tools");
    const saveButton = document.querySelector(".save-result");
    const saveStatus = document.querySelector(".save-status");
    const soundToggle = document.querySelector(".sound-toggle");
    const catMusic = document.createElement("audio");
    catMusic.preload = "none";
    catMusic.loop = true;
    catMusic.src = "./sounds/cat-background.wav?v=2";
    const catMeow = document.createElement("audio");
    catMeow.preload = "none";
    catMeow.src = "./sounds/cat-meow.wav?v=2";
    const defaultSwatch = document.querySelector('.swatch[aria-pressed="true"]');
    const mouseBrushRadius = 29.4;
    const touchBrushRadius = 39;
    const sampleSpacing = 6;
    let activeStroke = null;
    let selectedSwatch = defaultSwatch;
    let selectedCard = null;
    let silhouette = null;
    let galleryScroll = 0;
    let catTimer = null;
    let catMask = null;
    let catArea = 0;
    let needsCoverageCheck = false;
    let soundEnabled = true;
    let audioContext = null;
    let chime = null;
    let exportJob = null;
    let resultFile = null;
    let savedCatPaint = null;

    function updateCatPreview() {
      catCard.classList.toggle("has-saved-art", savedCatPaint !== null);
      catPreview.toggleAttribute("hidden", savedCatPaint === null);
      if (savedCatPaint) {
        catPreview.setAttribute("href", savedCatPaint);
        catCard.setAttribute("aria-label", "Кот, готовая раскраска");
      } else {
        catPreview.removeAttribute("href");
        catCard.removeAttribute("aria-label");
      }
    }

    try {
      const storedPaint = localStorage.getItem(catStorageKey);
      if (storedPaint?.startsWith("data:image/png;base64,")) savedCatPaint = storedPaint;
    } catch {}
    updateCatPreview();

    function rememberCatPaint(paint) {
      savedCatPaint = paint;
      updateCatPreview();
      try {
        if (paint) localStorage.setItem(catStorageKey, paint);
        else localStorage.removeItem(catStorageKey);
      } catch {}
    }

    function releaseStars() {
      if (reducedMotion.matches || document.hidden) return;

      const colors = ["#edac24", "#ec6b9a", "#649eef", "#9e78e4", "#4bb890"];
      const stars = document.createDocumentFragment();
      celebration.style.setProperty("--star-fall", `${celebration.clientHeight + 16}px`);

      for (let index = 0; index < 18; index++) {
        const star = document.createElement("span");
        star.className = "celebration-star";
        star.style.setProperty("--star-x", `${5 + index * 17 % 88}%`);
        star.style.setProperty("--star-size", `${7 + index * 5 % 7}px`);
        star.style.setProperty("--star-color", colors[index % colors.length]);
        star.style.setProperty("--star-delay", `${index * 26}ms`);
        star.style.setProperty("--star-time", `${1080 + index % 5 * 110}ms`);
        star.style.setProperty("--star-drift", `${(index % 5 - 2) * 9}px`);
        star.style.setProperty("--star-turn", `${index % 2 ? -125 : 145}deg`);
        star.addEventListener("animationend", () => star.remove(), { once: true });
        stars.append(star);
      }
      celebration.replaceChildren(stars);
    }

    function showCatResult() {
      editor.classList.add("is-complete");
      tools.inert = true;
      replay.hidden = false;
      resultTools.hidden = false;
      saveButton.disabled = true;
      saveStatus.hidden = true;
      replay.focus({ preventScroll: true });
    }

    async function restoreCatResult(paint) {
      const preview = new Image();
      preview.src = paint;
      try {
        await preview.decode();
        if (savedCatPaint !== paint || replay.hidden || editor.hidden) return;
        context.drawImage(preview, 0, 0);
      } catch {
        if (savedCatPaint === paint && !replay.hidden && !editor.hidden) restartCat();
        return;
      }
      prepareSave();
    }

    async function renderCatPng() {
      const drawing = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      drawing.setAttribute("viewBox", "0 0 1200 1200");
      drawing.setAttribute("width", String(canvas.width));
      drawing.setAttribute("height", String(canvas.height));
      for (const part of document.getElementById("drawing-cat").children) {
        drawing.append(part.cloneNode(true));
      }
      const source = new XMLSerializer().serializeToString(drawing);
      const url = URL.createObjectURL(new Blob([source], { type: "image/svg+xml" }));
      const exported = document.createElement("canvas");
      exported.width = canvas.width;
      exported.height = canvas.height;
      const output = exported.getContext("2d");
      output.fillStyle = "#ffffff";
      output.fillRect(0, 0, exported.width, exported.height);
      output.drawImage(canvas, 0, 0);

      try {
        const lines = new Image();
        lines.src = url;
        await lines.decode();
        output.drawImage(lines, 0, 0);
      } finally {
        URL.revokeObjectURL(url);
      }

      const png = await new Promise((resolve) => exported.toBlob(resolve, "image/png"));
      if (!png) throw new Error("PNG export failed");
      return new File([png], "Кот — Раскраска Анны.png", { type: "image/png" });
    }

    function prepareSave() {
      saveButton.disabled = true;
      saveStatus.hidden = true;

      const job = renderCatPng();
      exportJob = job;
      job.then((file) => {
        if (exportJob !== job) return;
        resultFile = file;
        saveButton.disabled = false;
      }, () => {
        if (exportJob !== job) return;
        saveStatus.textContent = "Не удалось подготовить рисунок. Попробуйте ещё раз.";
        saveStatus.hidden = false;
        saveButton.disabled = false;
      });
    }

    saveButton.addEventListener("click", async () => {
      const file = resultFile;
      if (!file) {
        prepareSave();
        return;
      }

      const share = { files: [file] };
      if (navigator.canShare?.(share)) {
        try {
          await navigator.share(share);
          return;
        } catch (error) {
          if (error.name === "AbortError") return;
        }
      }

      const link = document.createElement("a");
      const url = URL.createObjectURL(file);
      link.href = url;
      link.download = file.name;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    });

    function startCatMusic() {
      if (!soundEnabled) return;

      const AudioEngine = window.AudioContext || window.webkitAudioContext;
      if (AudioEngine) {
        audioContext ??= new AudioEngine();
        audioContext.resume().catch(() => {});
      }
      catMusic.play().catch(() => {});
    }

    function playCompletionSound() {
      if (!soundEnabled || audioContext?.state !== "running") return;

      if (!chime) {
        chime = audioContext.createGain();
        chime.connect(audioContext.destination);
      }
      const start = audioContext.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.5];

      for (const [index, frequency] of notes.entries()) {
        const note = audioContext.createOscillator();
        const envelope = audioContext.createGain();
        const onset = start + index * 0.1;
        note.type = "sine";
        note.frequency.value = frequency;
        envelope.gain.setValueAtTime(0, onset);
        envelope.gain.linearRampToValueAtTime(0.084, onset + 0.025);
        envelope.gain.exponentialRampToValueAtTime(0.0007, onset + 0.55);
        note.connect(envelope).connect(chime);
        note.start(onset);
        note.stop(onset + 0.56);
      }
    }

    function startCatSession() {
      catTimer = setInterval(checkCatCoverage, 5000);
      startCatMusic();
    }

    function stopCatSession() {
      clearInterval(catTimer);
      catTimer = null;
      catMusic.pause();
      catMusic.currentTime = 0;
      catMeow.pause();
      catMeow.currentTime = 0;
      chime?.disconnect();
      chime = null;
      replay.hidden = true;
      resultTools.hidden = true;
      exportJob = null;
      resultFile = null;
      editor.classList.remove("is-complete");
      tools.inert = false;
      celebration.replaceChildren();
      for (const animation of artwork.getAnimations()) animation.cancel();
    }

    function checkCatCoverage() {
      if (!needsCoverageCheck) return;
      needsCoverageCheck = false;

      if (catMask === null) {
        const mask = document.createElement("canvas");
        mask.width = canvas.width;
        mask.height = canvas.height;
        const maskContext = mask.getContext("2d");
        maskContext.fill(silhouette);
        catMask = maskContext.getImageData(0, 0, canvas.width, canvas.height).data;
        for (let index = 3; index < catMask.length; index += 4) {
          if (catMask[index] >= 128) catArea++;
        }
      }

      const paint = context.getImageData(0, 0, canvas.width, canvas.height).data;
      let colored = 0;
      for (let index = 3; index < catMask.length; index += 4) {
        if (catMask[index] >= 128 && paint[index] >= 128) colored++;
      }
      if (colored * 100 < catArea * 98) return;

      clearInterval(catTimer);
      catTimer = null;
      releaseBrush();
      catMusic.pause();
      playCompletionSound();
      rememberCatPaint(canvas.toDataURL("image/png"));
      showCatResult();
      releaseStars();
      prepareSave();
    }

    soundToggle.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundToggle.setAttribute("aria-pressed", String(soundEnabled));
      if (soundEnabled) startCatMusic();
      else catMusic.pause();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        catMusic.pause();
        catMeow.pause();
      } else if (catTimer !== null && soundEnabled) {
        catMusic.play().catch(() => {});
      }
    });

    replay.addEventListener("click", (event) => {
      if (artwork.getAnimations().length > 0) return;

      if (event.detail > 0) {
        const point = positionOnCanvas(event);
        if (!context.isPointInPath(silhouette, point.x, point.y)) return;
      }
      if (soundEnabled) {
        catMeow.currentTime = 0;
        catMeow.play().catch(() => {});
      }

      if (reducedMotion.matches) {
        artwork.animate([{ opacity: 1 }, { opacity: 0.72 }, { opacity: 1 }], { duration: 250 });
        return;
      }

      artwork.animate([
        { transform: "translateY(0) rotateY(0deg) rotateZ(0deg)" },
        { transform: "translateY(-5%) rotateY(55deg) rotateZ(-8deg)", offset: 0.23 },
        { transform: "translateY(-8%) rotateY(180deg) rotateZ(0deg)", offset: 0.5 },
        { transform: "translateY(-2%) rotateY(315deg) rotateZ(7deg)", offset: 0.82 },
        { transform: "translateY(0) rotateY(360deg) rotateZ(0deg)" },
      ], { duration: 870, easing: "ease-in-out" });
    });

    function selectColor(swatch) {
      selectedSwatch.setAttribute("aria-pressed", "false");
      swatch.setAttribute("aria-pressed", "true");
      selectedSwatch = swatch;
    }

    for (const swatch of document.querySelectorAll(".swatch")) {
      swatch.addEventListener("click", () => selectColor(swatch));
    }

    for (const card of gallery.querySelectorAll(".drawing-card")) {
      const symbol = document.getElementById("drawing-" + card.dataset.drawing);
      const contours = Array.from(symbol.querySelectorAll("[data-silhouette]"), (shape) => shape.getAttribute("d"));
      const path = new Path2D(contours.join(" "));
      card.addEventListener("click", () => {
        selectedCard = card;
        galleryScroll = window.scrollY;
        silhouette = path;
        const name = card.querySelector("span").textContent;
        outline.setAttribute("href", "#" + symbol.id);
        editorTitle.textContent = name;
        canvas.setAttribute("aria-label", "Раскраска — " + name);
        resetPainting();
        selectColor(defaultSwatch);
        soundToggle.hidden = card !== catCard;
        gallery.hidden = true;
        editor.hidden = false;
        window.scrollTo(0, 0);
        editorTitle.focus({ preventScroll: true });

        if (card === catCard && savedCatPaint) {
          showCatResult();
          restoreCatResult(savedCatPaint);
        } else if (card === catCard) {
          startCatSession();
        }
      });
    }

    editor.querySelector(".back").addEventListener("click", () => {
      stopCatSession();
      resetPainting();
      editor.hidden = true;
      gallery.hidden = false;
      window.scrollTo(0, galleryScroll);
      selectedCard.focus({ preventScroll: true });
    });

    function positionOnCanvas(event) {
      const bounds = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - bounds.left) * canvas.width / bounds.width,
        y: (event.clientY - bounds.top) * canvas.height / bounds.height,
      };
    }

    function paintBetween(start, end, color, radius) {
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / sampleSpacing));
      const dots = new Path2D();
      let hasDots = false;

      for (let step = 1; step <= steps; step++) {
        const x = start.x + dx * step / steps;
        const y = start.y + dy * step / steps;
        if (context.isPointInPath(silhouette, x, y)) {
          hasDots = true;
          dots.moveTo(x + radius, y);
          dots.arc(x, y, radius, 0, 2 * Math.PI);
        }
      }

      if (!hasDots) return;
      if (catTimer !== null) needsCoverageCheck = true;

      context.save();
      context.clip(silhouette);
      context.fillStyle = color;
      context.fill(dots);
      context.restore();
    }

    canvas.addEventListener("pointerdown", (event) => {
      if (!replay.hidden || activeStroke || event.button !== 0) return;

      const point = positionOnCanvas(event);
      const color = selectedSwatch.style.getPropertyValue("--ink");
      const radius = event.pointerType === "mouse" ? mouseBrushRadius : touchBrushRadius;
      canvas.setPointerCapture(event.pointerId);
      activeStroke = { pointerId: event.pointerId, point, color, radius };
      paintBetween(point, point, color, radius);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (event.pointerId !== activeStroke?.pointerId) return;

      const point = positionOnCanvas(event);
      paintBetween(activeStroke.point, point, activeStroke.color, activeStroke.radius);
      activeStroke.point = point;
    });

    function endStroke(event) {
      if (event.pointerId === activeStroke?.pointerId) activeStroke = null;
    }

    canvas.addEventListener("pointerup", endStroke);
    canvas.addEventListener("pointercancel", endStroke);
    canvas.addEventListener("lostpointercapture", endStroke);

    function releaseBrush() {
      const pointerId = activeStroke?.pointerId;
      activeStroke = null;
      if (pointerId !== undefined && canvas.hasPointerCapture(pointerId)) {
        canvas.releasePointerCapture(pointerId);
      }
    }

    function resetPainting() {
      releaseBrush();
      needsCoverageCheck = false;
      context.clearRect(0, 0, canvas.width, canvas.height);
    }

    editor.querySelector(".drawing-actions .reset").addEventListener("click", resetPainting);

    function restartCat() {
      rememberCatPaint(null);
      stopCatSession();
      resetPainting();
      selectColor(defaultSwatch);
      startCatSession();
      editorTitle.focus({ preventScroll: true });
    }

    editor.querySelector(".restart-result").addEventListener("click", restartCat);
  </script>
</body>
</html>
