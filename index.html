<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2edf9">
  <title>Раскраска</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
      color: #302344;
      background: #f2edf9;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      --top-inset: max(12px, env(safe-area-inset-top));
      --bottom-inset: max(12px, env(safe-area-inset-bottom));
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: var(--top-inset) max(12px, env(safe-area-inset-right))
        var(--bottom-inset) max(12px, env(safe-area-inset-left));
      background: radial-gradient(ellipse at 50% 12%, #faf6ff, #f2edf9 72%);
    }

    .app {
      width: min(100%, 650px);
      margin: auto;
    }

    .art-library { position: absolute; }

    .gallery,
    .editor {
      display: grid;
      justify-items: center;
      gap: clamp(10px, 2svh, 18px);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.75rem);
      font-weight: 850;
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .gallery {
      gap: clamp(16px, 3svh, 26px);
    }

    .gallery-grid {
      --card-gap: clamp(10px, 3vw, 18px);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--card-gap);
      width: min(100%, 600px);
    }

    .drawing-card {
      display: grid;
      justify-items: center;
      gap: 4px;
      min-width: 0;
      padding: 6px 8px 12px;
      border: 2px solid #fff;
      border-radius: clamp(20px, 5vw, 32px);
      background: var(--tile);
      box-shadow: 0 5px 14px #4b306316;
      font-size: clamp(1rem, 4.5vw, 1.35rem);
      font-weight: 800;
    }

    .drawing-card svg {
      display: block;
      width: 100%;
      height: clamp(82px, min(39vw, 18svh), 200px);
    }

    .drawing-card:last-child:nth-child(odd) {
      grid-column: 1 / -1;
      justify-self: center;
      width: calc((100% - var(--card-gap)) / 2);
    }

    .drawing-card:active { border-color: #b79ece; }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: min(100%, 570px, max(160px, calc(100svh - 215px)));
      min-width: min(100%, 245px);
    }

    .editor-header h1 {
      margin: 0;
      font-size: clamp(1.35rem, 5vw, 1.9rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .editor-header h1:focus { outline: none; }

    .board {
      position: relative;
      width: min(100%, 570px, max(160px, calc(100svh - 215px)));
      aspect-ratio: 1;
      overflow: hidden;
      border: 2px solid #e5daf0;
      border-radius: clamp(20px, 6vw, 34px);
      background: #fff;
      box-shadow: 0 8px 24px #4b306315;
    }

    .board > * {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    canvas {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .outline { pointer-events: none; }

    .tools {
      display: grid;
      justify-items: center;
      gap: clamp(8px, 1.5svh, 14px);
      max-width: 100%;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(4, auto);
      gap: clamp(3px, 1.4vw, 10px);
      max-width: 100%;
      padding: 5px clamp(4px, 2vw, 12px);
      border: 1px solid #e9dff2;
      border-radius: 40px;
      background: #fff;
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 3px solid #473369;
      outline-offset: 2px;
    }

    .swatch {
      display: grid;
      place-items: center;
      width: clamp(44px, 10vw, 54px);
      height: clamp(44px, 10vw, 54px);
      padding: 3px;
      border: 2px solid transparent;
      border-radius: 50%;
      background: transparent;
    }

    .swatch::before {
      content: "";
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--ink);
      box-shadow: inset 0 -3px 0 #30234418;
    }

    .swatch[aria-pressed="true"] { border-color: #483161; }

    .reset,
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 6px 16px;
      border: 1px solid #e2d4ed;
      border-radius: 24px;
      background: #ece2f6;
      font-weight: 750;
    }

    .back {
      padding: 6px 12px;
      background: #fbf8ff;
      white-space: nowrap;
    }

    .reset:active { background: #e1d1f1; }
    .back:active { background: #ece2f6; }
    .reset span, .back span { font-size: 1.35em; line-height: 1; }

    @media (min-width: 520px) {
      .palette { grid-template-columns: repeat(8, auto); }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .gallery-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: 100%;
      }

      .drawing-card { font-size: clamp(0.85rem, 2.3vw, 1rem); }
      .drawing-card svg { height: min(17vw, (100svh - 192px) / 2); }

      .drawing-card:last-child:nth-child(odd) {
        grid-column: auto;
        width: 100%;
      }

      .editor {
        grid-template-columns: auto auto;
        grid-template-rows: auto auto;
        align-items: center;
        justify-content: center;
      }

      .board {
        grid-area: 1 / 1 / 3 / 2;
        width: min(54vw, calc(100svh - var(--top-inset) - var(--bottom-inset) - 8px));
      }

      .editor-header {
        grid-area: 1 / 2 / 2 / 3;
        align-self: end;
        display: grid;
        justify-items: center;
        width: auto;
        min-width: 0;
      }

      .tools {
        grid-area: 2 / 2 / 3 / 3;
        align-self: start;
      }

      .palette { grid-template-columns: repeat(4, auto); }
    }

    @media (orientation: landscape) and (min-width: 720px) and (max-height: 500px) {
      .gallery-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .drawing-card svg { height: min(17vw, 100svh - 135px); }
    }
  </style>
</head>

          <span>Кот</span>
        </button>
        <button class="drawing-card" type="button" data-drawing="dolphin" style="--tile: #e8f5ff; --paper: #a7d9fa">
          <svg viewBox="70 130 1060 940" aria-hidden="true"><use href="#drawing-dolphin" width="1200" height="1200"/></svg>
          <span>Дельфин</span>
        </button>
        <button class="drawing-card" type="button" data-drawing="car" style="--tile: #eaf7eb; --paper: #a7dfbe; --detail: #f8fff7">
          <svg viewBox="60 160 1080 940" aria-hidden="true"><use href="#drawing-car" width="1200" height="1200"/></svg>
          <span>Машинка</span>
        </button>
        <button class="drawing-card" type="button" data-drawing="korzhik"
          style="--tile: #fff1dd; --paper: #f5a353; --detail: #d1effc; --detail-ink: #4a91b6; --eye: #fff; --mouth: #b85836">
          <svg viewBox="120 110 980 980" aria-hidden="true"><use href="#drawing-korzhik" width="1200" height="1200"/></svg>
          <span>Коржик</span>
        </button>
        <button class="drawing-card" type="button" data-drawing="karamelka"
          style="--tile: #ffebef; --paper: #f59946; --ear: #ffe0af; --dress: #ee4763; --eye: #fff; --mouth: #b85b3d">
          <svg viewBox="40 110 980 980" aria-hidden="true"><use href="#drawing-karamelka" width="1200" height="1200"/></svg>
          <span>Карамелька</span>
        </button>
      </div>
    </section>

    <section class="editor" aria-labelledby="editor-title" hidden>
      <header class="editor-header">
        <button class="back" type="button"><span aria-hidden="true">‹</span> К рисункам</button>
        <h1 id="editor-title" tabindex="-1"></h1>
      </header>
      <div class="board">
        <canvas width="1200" height="1200"></canvas>
        <svg class="outline" viewBox="0 0 1200 1200" aria-hidden="true"><use width="1200" height="1200"/></svg>
      </div>

      <div class="tools">
        <div class="palette" role="group" aria-label="Цвета">
          <button type="button" class="swatch" style="--ink: #ff6685" aria-label="Розовый" aria-pressed="true"></button>
          <button type="button" class="swatch" style="--ink: #ff9944" aria-label="Оранжевый" aria-pressed="false"></button>
          <button type="button" class="swatch" style="--ink: #f9d64d" aria-label="Жёлтый" aria-pressed="false"></button>
          <button type="button" class="swatch" style="--ink: #59cb8d" aria-label="Зелёный" aria-pressed="false"></button>
          <button type="button" class="swatch" style="--ink: #57b1f4" aria-label="Голубой" aria-pressed="false"></button>
          <button type="button" class="swatch" style="--ink: #a17bf1" aria-label="Фиолетовый" aria-pressed="false"></button>
          <button type="button" class="swatch" style="--ink: #e83b43" aria-label="Красный" aria-pressed="false"></button>
          <button type="button" class="swatch" style="--ink: #91573a" aria-label="Коричневый" aria-pressed="false"></button>
        </div>
        <button class="reset" type="button"><span aria-hidden="true">↺</span> Очистить</button>
      </div>
    </section>
  </main>

  <script>
    const gallery = document.querySelector(".gallery");
    const editor = document.querySelector(".editor");
    const editorTitle = document.querySelector("#editor-title");
    const outline = document.querySelector(".outline use");
    const canvas = document.querySelector("canvas");
    const context = canvas.getContext("2d");
    const defaultSwatch = document.querySelector('.swatch[aria-pressed="true"]');
    const brushRadius = 42;
    const sampleSpacing = 6;
    let activeStroke = null;
    let selectedSwatch = defaultSwatch;
    let selectedCard = null;
    let silhouette = null;

    function selectColor(swatch) {
      selectedSwatch.setAttribute("aria-pressed", "false");
      swatch.setAttribute("aria-pressed", "true");
      selectedSwatch = swatch;
    }

    for (const swatch of document.querySelectorAll(".swatch")) {
      swatch.addEventListener("click", () => selectColor(swatch));
    }

    for (const card of gallery.querySelectorAll(".drawing-card")) {
      const symbol = document.getElementById("drawing-" + card.dataset.drawing);
      const contours = Array.from(symbol.querySelectorAll("[data-silhouette]"), (shape) => shape.getAttribute("d"));
      const path = new Path2D(contours.join(" "));
      card.addEventListener("click", () => {
        selectedCard = card;
        silhouette = path;
        const name = card.querySelector("span").textContent;
        outline.setAttribute("href", "#" + symbol.id);
        editorTitle.textContent = name;
        canvas.setAttribute("aria-label", "Раскраска — " + name);
        resetPainting();
        selectColor(defaultSwatch);
        gallery.hidden = true;
        editor.hidden = false;
        editorTitle.focus({ preventScroll: true });
      });
    }

    editor.querySelector(".back").addEventListener("click", () => {
      resetPainting();
      editor.hidden = true;
      gallery.hidden = false;
      selectedCard.focus({ preventScroll: true });
    });

    function positionOnCanvas(event) {
      const bounds = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - bounds.left) * canvas.width / bounds.width,
        y: (event.clientY - bounds.top) * canvas.height / bounds.height,
      };
    }

    function paintBetween(start, end, color) {
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / sampleSpacing));
      const dots = new Path2D();

      for (let step = 1; step <= steps; step++) {
        const x = start.x + dx * step / steps;
        const y = start.y + dy * step / steps;
        if (context.isPointInPath(silhouette, x, y)) {
          dots.moveTo(x + brushRadius, y);
          dots.arc(x, y, brushRadius, 0, 2 * Math.PI);
        }
      }

      context.save();
      context.clip(silhouette);
      context.fillStyle = color;
      context.fill(dots);
      context.restore();
    }

    canvas.addEventListener("pointerdown", (event) => {
      if (activeStroke || event.button !== 0) return;

      const point = positionOnCanvas(event);
      const color = selectedSwatch.style.getPropertyValue("--ink");
      canvas.setPointerCapture(event.pointerId);
      activeStroke = { pointerId: event.pointerId, point, color };
      paintBetween(point, point, color);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (event.pointerId !== activeStroke?.pointerId) return;

      const point = positionOnCanvas(event);
      paintBetween(activeStroke.point, point, activeStroke.color);
      activeStroke.point = point;
    });

    function endStroke(event) {
      if (event.pointerId === activeStroke?.pointerId) activeStroke = null;
    }

    canvas.addEventListener("pointerup", endStroke);
    canvas.addEventListener("pointercancel", endStroke);
    canvas.addEventListener("lostpointercapture", endStroke);

    function resetPainting() {
      const pointerId = activeStroke?.pointerId;
      activeStroke = null;
      if (pointerId !== undefined && canvas.hasPointerCapture(pointerId)) {
        canvas.releasePointerCapture(pointerId);
      }
      context.clearRect(0, 0, canvas.width, canvas.height);
    }

    editor.querySelector(".reset").addEventListener("click", resetPainting);
  </script>
</body>
</html>
